<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none">
  <!-- Background glow -->
  <ellipse cx="240" cy="200" rx="200" ry="100" fill="rgba(59,130,246,0.08)"/>
  
  <!-- Main card / data panel -->
  <rect x="60" y="60" width="360" height="200" rx="16" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  
  <!-- Header bar -->
  <rect x="60" y="60" width="360" height="44" rx="16" fill="rgba(255,255,255,0.12)"/>
  <rect x="60" y="88" width="360" height="16" fill="rgba(255,255,255,0.06)"/>
  
  <!-- Dots in header -->
  <circle cx="88" cy="82" r="6" fill="rgba(239,68,68,0.7)"/>
  <circle cx="108" cy="82" r="6" fill="rgba(234,179,8,0.7)"/>
  <circle cx="128" cy="82" r="6" fill="rgba(34,197,94,0.7)"/>
  
  <!-- Title placeholder -->
  <rect x="160" y="76" width="120" height="12" rx="4" fill="rgba(255,255,255,0.22)"/>
  
  <!-- Chart bars -->
  <rect x="100" y="160" width="28" height="60" rx="5" fill="rgba(59,130,246,0.5)"/>
  <rect x="140" y="140" width="28" height="80" rx="5" fill="rgba(99,102,241,0.55)"/>
  <rect x="180" y="120" width="28" height="100" rx="5" fill="rgba(59,130,246,0.7)"/>
  <rect x="220" y="105" width="28" height="115" rx="5" fill="rgba(139,92,246,0.6)"/>
  <rect x="260" y="130" width="28" height="90" rx="5" fill="rgba(59,130,246,0.55)"/>
  <rect x="300" y="150" width="28" height="70" rx="5" fill="rgba(99,102,241,0.45)"/>
  <rect x="340" y="165" width="28" height="55" rx="5" fill="rgba(59,130,246,0.4)"/>
  
  <!-- Trend line -->
  <polyline points="114,175 154,155 194,135 234,122 274,145 314,162 354,175" stroke="rgba(147,197,253,0.85)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Data point dots on line -->
  <circle cx="114" cy="175" r="4" fill="#60a5fa"/>
  <circle cx="154" cy="155" r="4" fill="#60a5fa"/>
  <circle cx="194" cy="135" r="4" fill="#818cf8"/>
  <circle cx="234" cy="122" r="5" fill="#a78bfa"/>
  <circle cx="274" cy="145" r="4" fill="#60a5fa"/>
  <circle cx="314" cy="162" r="4" fill="#818cf8"/>
  <circle cx="354" cy="175" r="4" fill="#60a5fa"/>
  
  <!-- Floating metric card -->
  <rect x="290" y="75" width="110" height="50" rx="10" fill="rgba(99,102,241,0.35)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="310" y="96" font-family="Inter, sans-serif" font-size="10" fill="rgba(255,255,255,0.65)">TOTAL MEMBERS</text>
  <text x="310" y="114" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="white">12,480</text>
  
  <!-- Shield / security icon at bottom right -->
  <circle cx="400" cy="240" r="28" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.4)" stroke-width="1.5"/>
  <path d="M400 227 L412 232 L412 242 Q412 250 400 255 Q388 250 388 242 L388 232 Z" fill="rgba(59,130,246,0.55)" stroke="rgba(147,197,253,0.8)" stroke-width="1"/>
  <path d="M395 241 L398 244 L406 237" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
